version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    # 👇 Important: match your Angular output directory
    baseDirectory: dist/todoapp
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
